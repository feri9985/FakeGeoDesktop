name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q FakeGeoDesktop.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build app
        working-directory: FakeGeoDesktop
        run: gradle createDistributable --no-daemon

      - name: Sign and make dmg
        working-directory: FakeGeoDesktop
        run: |
          APP=build/compose/binaries/main/app/FakeGeo.app
          codesign --force --deep --sign - "$APP"
          mkdir dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname FakeGeo -srcfolder dmgroot -ov -format UDZO FakeGeo.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: FakeGeo-mac-dmg
          path: FakeGeoDesktop/FakeGeo.dmg
