name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q FakeGeoDesktop.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build dmg
        working-directory: FakeGeoDesktop
        run: gradle packageDmg --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FakeGeo-mac-dmg
          path: FakeGeoDesktop/build/compose/binaries/main/dmg/*.dmg
